services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
      POSTGRES_DB: contracts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d contracts"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./app
    environment:
      DATABASE_URL: postgresql+psycopg2://water:water@db:5432/contracts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
